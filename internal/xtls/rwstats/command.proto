syntax = "proto3";

package xray.app.stats.command;

option go_package = "github.com/Luxiaba/remnawave-node-lite-go/internal/xtls/rwstats";

// This is the GetUsersStats extension shipped by @remnawave/xtls-sdk 0.16.0.
// The upstream xray-core Go module does not yet expose these generated types.
message OnlineIPEntry {
  string ip = 1;
  int64 last_seen = 2;
}

message TrafficUserStat {
  int64 uplink = 1;
  int64 downlink = 2;
}

message UserStat {
  string email = 1;
  repeated OnlineIPEntry ips = 2;
  TrafficUserStat traffic = 3;
}

message GetUsersStatsRequest {
  bool include_traffic = 1;
  bool reset = 2;
}

message GetUsersStatsResponse {
  repeated UserStat users = 1;
}
