name: contract-sync

on:
  schedule:
    # 每周一 UTC 02:00 对比官方 remnawave/node contract
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "remnawave/node git ref (tag/branch)"
        required: false
        default: "3.3.2"

jobs:
  compare-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream remnawave/node
        run: |
          ref="${{ github.event.inputs.upstream_ref }}"
          if [ -z "$ref" ]; then
            ref=$(tr -d ' \n\r' < internal/version/contract.version)
          fi
          git clone --depth 1 --branch "$ref" https://github.com/remnawave/node.git /tmp/remnawave-node

      - name: Report upstream version
        id: official
        run: |
          node_ver=$(python3 -c "import json; print(json.load(open('/tmp/remnawave-node/package.json'))['version'])")
          wire_ver=$(python3 -c "import json; print(json.load(open('/tmp/remnawave-node/libs/contract/package.json'))['version'])")
          local_node_ver=$(tr -d ' \n\r' < internal/version/contract.version)
          local_wire_ver=$(tr -d ' \n\r' < internal/version/node-contract.version)
          echo "Upstream @remnawave/node version: $node_ver"
          echo "Upstream @remnawave/node-contract version: $wire_ver"
          echo "Lite-go reported nodeVersion: $local_node_ver"
          echo "Lite-go wire contract baseline: $local_wire_ver"
          echo "upstream_version=$node_ver" >> "$GITHUB_OUTPUT"
          if [ "$node_ver" != "$local_node_ver" ]; then
            echo "::error::reported nodeVersion ($local_node_ver) != upstream node ($node_ver)"
            exit 1
          fi
          if [ "$wire_ver" != "$local_wire_ver" ]; then
            echo "::error::wire contract baseline ($local_wire_ver) != upstream node-contract ($wire_ver)"
            exit 1
          fi
          python3 scripts/extract-contract-routes.py /tmp/remnawave-node > /tmp/official-routes.txt
          echo "count=$(wc -l < /tmp/official-routes.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Extract lite-go implemented routes
        run: |
          grep -E '^\s*"/node/' internal/contract/routes_test.go \
            | sed 's/.*"\(\/[^"]*\)".*/\1/' \
            | sort -u > /tmp/lite-routes.txt

      - name: Diff routes
        run: |
          echo "=== Official only (missing in lite-go) ==="
          comm -23 /tmp/official-routes.txt /tmp/lite-routes.txt || true
          echo ""
          echo "=== Lite-go only (not in official contract) ==="
          comm -13 /tmp/official-routes.txt /tmp/lite-routes.txt || true
          echo ""
          missing=$(comm -23 /tmp/official-routes.txt /tmp/lite-routes.txt | wc -l | tr -d ' ')
          if [ "$missing" != "0" ]; then
            echo "::error::Found $missing official route(s) not covered in lite-go contract test"
            exit 1
          fi
          echo "All ${{ steps.official.outputs.count }} official routes are covered."

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test contract
        run: go test ./internal/contract/...
