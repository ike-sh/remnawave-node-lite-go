name: test

on:
  push:
    branches: [main, release/v1.4.0-rc]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./...

      - name: go test (race detector)
        run: go test -race ./...

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          go build -o /dev/null ./cmd/remnanode-lite
          go build -o /dev/null ./cmd/asn-builder

      - name: install and upgrade env preservation
        run: bash scripts/test-install-env-helpers.sh

      - name: isolated native socket destroy integration
        shell: bash
        run: |
          CGO_ENABLED=0 go test -c -o "${RUNNER_TEMP}/netadmin.test" ./internal/netadmin
          docker run --rm --cap-add NET_ADMIN \
            -v "${RUNNER_TEMP}:/audit:ro" debian:bookworm-slim sh -c '
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 libcap2-bin >/dev/null &&
              uname -a && ss -V && id && capsh --print &&
              REMNANODE_SOCKET_INTEGRATION=1 /audit/netadmin.test -test.run=TestKillSocketsByIP -test.v
            '
